<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mont;font-weight:800;src:url(montserrat-latin-800-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Osw;font-weight:700;src:url(oswald-latin-700-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Mont;font-weight:500;src:url(montserrat-latin-500-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-latin-700-normal.woff2);unicode-range:U+0000-00FF}
@font-face{font-family:Osw;font-weight:700;src:url(oswald-cyrillic-700-normal.woff2)}
@font-face{font-family:Osw;font-weight:600;src:url(oswald-cyrillic-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:500;src:url(montserrat-cyrillic-500-normal.woff2)}
@font-face{font-family:Mont;font-weight:600;src:url(montserrat-cyrillic-600-normal.woff2)}
@font-face{font-family:Mont;font-weight:700;src:url(montserrat-cyrillic-700-normal.woff2)}
@font-face{font-family:Mont;font-weight:800;src:url(montserrat-cyrillic-800-normal.woff2)}
:root{--blue:#14506f;--gold:#c99a52;--ink:#2b3a44;--muted:#6b7780}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:url(template.png) 0 0/1080px 1350px no-repeat;font-family:Mont;position:relative}
.c{position:absolute;left:236px;right:56px;top:0;bottom:0}
.kick{position:absolute;top:92px;font:800 22px Mont;letter-spacing:.42em;color:var(--ink)}
.kick:after{content:"";display:block;width:56px;height:4px;background:var(--gold);margin-top:18px;border-radius:2px}
h1{position:absolute;top:148px;font:700 100px/1 Osw;letter-spacing:.005em;color:var(--blue);white-space:nowrap}
h1 b{color:var(--gold);font-weight:700}
.card{position:absolute;top:300px;left:-54px;right:-56px}
.card img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.rows{position:absolute;top:956px;left:0;right:0;display:grid;grid-template-columns:150px 1fr;row-gap:30px}
.l{font:700 17px Mont;letter-spacing:.32em;color:var(--gold);padding-top:9px}
.v{font:700 28px/1.15 Mont;color:var(--blue)}
.v small{display:block;font:500 20px/1.3 Mont;color:var(--muted);margin-top:5px}
</style></head><body><div class="c">
<div class="kick">{{KICK}}</div>
<h1>{{H1}}</h1>
<div class="card"><img src="{{IMG}}" style="object-position:{{POS}}"></div>
<div class="rows">{{ROWS}}</div>
</div></body></html>
